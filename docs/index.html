<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>zodiac-clue 문서</title>
<style>
  :root { --bg:#16130f; --panel:#1a1611; --card:#211c16; --edge:#3a3126; --ink:#f0e9dc; --dim:#a89778; --gold:#f0d9a8; --accent:#b4622b; }
  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: #4a3d2b #16130f; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-track { background:#16130f; border-radius:5px; }
  ::-webkit-scrollbar-thumb { background:#4a3d2b; border-radius:5px; border:2px solid #16130f; }
  ::-webkit-scrollbar-thumb:hover { background:#6b5838; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); display:flex; overflow:hidden;
    font-family: system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif; line-height:1.7; }
  a { color:#e0a35a; }

  /* ── 좌측 트리 ── */
  .sidebar { width:300px; flex:none; background:var(--panel); border-right:1px solid var(--edge);
    overflow-y:auto; display:flex; flex-direction:column; }
  .side-head { padding:16px 16px 10px; border-bottom:1px solid var(--edge); }
  .side-head .brand { color:var(--gold); font-weight:700; font-size:15px; }
  .side-head .links { margin-top:8px; font-size:12px; display:flex; flex-wrap:wrap; gap:8px; }
  .side-head .links a { color:var(--dim); text-decoration:none; }
  .side-head .links a:hover { color:#e0a35a; }
  nav#tree { padding:8px 6px 24px; }
  nav#tree details { margin:2px 0; }
  nav#tree summary { cursor:pointer; list-style:none; padding:6px 10px; font-size:12px; color:var(--gold);
    letter-spacing:.3px; border-radius:6px; user-select:none; }
  nav#tree summary::-webkit-details-marker { display:none; }
  nav#tree summary::before { content:"▾ "; color:var(--dim); }
  nav#tree details:not([open]) summary::before { content:"▸ "; }
  nav#tree summary:hover { background:#221c15; }
  nav#tree a.doc { display:block; padding:6px 10px 6px 26px; font-size:13px; color:#cbbfa8;
    text-decoration:none; border-radius:6px; border-left:2px solid transparent; }
  nav#tree a.doc:hover { background:#221c15; color:var(--ink); }
  nav#tree a.doc.active { background:#2c2317; color:var(--gold); border-left-color:var(--accent); }
  /* 외부 링크(빌드·영상) — 문서가 아니라 새 탭으로 나가는 항목 */
  nav#tree a.doc.ext { color:#9fd0e0; border-left:2px solid #2f5a6a; }
  nav#tree a.doc.ext:hover { color:#c8ecf7; background:#16232a; }
  nav#tree a.doc.ext::before { content:"↗ "; color:var(--dim); font-size:11px; }

  /* ── 내부 전용 표기 ──
     이 스타일이 그려지는 것은 **로컬뿐**이다(manifest.local.json이 배포본에 없다).
     그래도 «공개된 문서»로 오해하지 않도록 파선·자물쇠·별도 섹션으로 분명히 가른다. */
  nav#tree a.doc.priv { color:#c9a06a; border-left:2px dashed #7a5c30; }
  nav#tree a.doc.priv:hover { color:#f0c48a; background:#261d12; }
  nav#tree a.doc.priv.active { background:#2f2415; color:#f0c48a; border-left-color:#c9793a; }
  nav#tree a.doc.priv::before { content:"🔒 "; font-size:11px; }
  .priv-badge { display:inline-block; font-size:11px; color:#f0c48a; background:#3a2a15;
    border:1px dashed #8a6a3a; border-radius:5px; padding:0 6px; margin-right:7px; }
  .privbox { margin-top:26px; padding:14px 16px; border:1px dashed #8a6a3a; border-radius:12px;
    background:#241a10; }
  .privbox h2 { margin:0 0 5px !important; color:#f0c48a !important; border:0 !important; padding:0 !important; }
  .privbox .why { font-size:12px; color:var(--dim); margin:0 0 11px; }
  .privbox .feat a { background:#1e1710; border-style:dashed; border-left:3px dashed #8a6a3a; }
  .privbox .feat a:hover { border-color:#c9793a; border-left-color:#e0a35a; }
  .privbox .feat .k { color:#f0c48a; }

  /* ── 본문 ── */
  .main { flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar { flex:none; display:flex; align-items:center; gap:12px; padding:10px 18px;
    background:rgba(22,19,15,0.92); backdrop-filter:blur(4px); border-bottom:1px solid var(--edge); }
  .topbar button { background:#2c2519; color:var(--ink); border:1px solid var(--edge); border-radius:6px;
    padding:6px 12px; font-size:13px; cursor:pointer; }
  .topbar button:hover { background:#3a3126; }
  .topbar .crumb { flex:1; color:var(--dim); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .topbar a.raw { color:var(--dim); font-size:12px; text-decoration:none; }
  .topbar .hamburger { display:none; }
  .scroll { flex:1; overflow:auto; }
  iframe.docframe { width:100%; height:100%; border:0; background:var(--bg); }

  /* 마크다운 렌더 톤 */
  .wrap { max-width:900px; margin:0 auto; padding:26px 24px 80px; }
  .md h1 { color:var(--gold); font-size:25px; margin:22px 0 8px; }
  .md h2 { color:var(--gold); font-size:19px; margin:30px 0 10px; border-bottom:1px solid var(--edge); padding-bottom:6px; }
  .md h3 { font-size:15px; margin:18px 0 6px; }
  .md p, .md li { font-size:14px; }
  .md strong { color:var(--gold); }
  .md code { background:#2c2519; border:1px solid var(--edge); border-radius:4px; padding:1px 5px; font-size:13px; }
  .md pre { background:#0f0d0a; border:1px solid var(--edge); border-radius:8px; padding:12px 14px; overflow-x:auto; }
  .md pre code { background:none; border:0; padding:0; font-size:13px; line-height:1.5; }
  .md blockquote { margin:12px 0; padding:8px 14px; border-left:3px solid var(--accent); background:#2b2013;
    border-radius:0 8px 8px 0; color:var(--dim); font-size:13px; }
  .md hr { border:0; border-top:1px solid var(--edge); margin:22px 0; }
  .md ul, .md ol { padding-left:22px; }
  .md li { margin:2px 0; }
  .md table { width:100%; border-collapse:collapse; margin:14px 0; font-size:13px; display:block; overflow-x:auto; }
  .md th, .md td { border:1px solid var(--edge); padding:8px 10px; text-align:left; vertical-align:top; }
  .md th { background:#2c2519; color:var(--gold); }
  .md .chk { display:inline-block; width:1.2em; }
  .md .chk-done { color:#7ee29a; } .md .chk-todo { color:var(--dim); } .md .chk-part { color:#e0c25a; }

  /* 개요(홈) */
  .home-card { background:var(--card); border:1px solid var(--edge); border-radius:12px; padding:24px 26px; }
  .home-card h1 { color:var(--gold); margin:0 0 6px; font-size:24px; }
  .home-card p { font-size:14px; color:var(--dim); }
  .live { display:inline-block; margin-top:8px; }
  .home-card h2 { color:var(--gold); font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    margin:26px 0 10px; border:0; padding:0; }
  .feat { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
  .feat a { display:block; text-decoration:none; background:#1a1611; border:1px solid var(--edge);
    border-left:3px solid var(--accent); border-radius:9px; padding:12px 14px; }
  .feat a:hover { background:#221c15; border-color:#6b5838; border-left-color:#e0a35a; }
  .feat .k { color:var(--gold); font-size:13.5px; font-weight:700; display:block; }
  .feat .d { color:var(--dim); font-size:12px; display:block; margin-top:3px; line-height:1.5; }
  .groups { display:flex; flex-wrap:wrap; gap:7px; }
  .groups a { text-decoration:none; background:#2c2519; border:1px solid var(--edge); border-radius:20px;
    padding:4px 12px; font-size:12.5px; color:#cbbfa8; }
  .groups a:hover { color:var(--gold); border-color:#6b5838; }
  .groups b { color:var(--gold); font-weight:700; }
  .home-note { margin-top:22px; padding-top:14px; border-top:1px solid var(--edge); font-size:12.5px; }

  @media (max-width:760px) {
    .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:30; transform:translateX(-100%);
      transition:transform .2s; box-shadow:8px 0 30px rgba(0,0,0,.5); }
    .sidebar.open { transform:none; }
    .topbar .hamburger { display:inline-block; }
    .backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:25; }
    .backdrop.show { display:block; }
  }

/* ══════════ PDF 인쇄 — 이 페이지는 '뷰어'다 ══════════
   body{display:flex;overflow:hidden} + iframe 구조라 그대로 인쇄하면 백지 한 장이 나온다.
   레이아웃을 풀고 iframe/사이드바를 감춘 뒤, 개별 문서를 열라는 안내만 남긴다. */
@media print {
  @page { size:A4; margin:14mm; }
  :root { --bg:#fff; --panel:#fff; --card:#faf7f0; --edge:#c7bba4; --ink:#1a1712; --dim:#4f4738;
          --gold:#5b430f; --accent:#8a4718; }
  html { height:auto !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  body { display:block !important; overflow:visible !important; height:auto !important;
    background:#fff !important; color:var(--ink) !important; line-height:1.55; }
  /* 인쇄해도 의미 없는 셸 */
  .sidebar, .backdrop, .topbar, iframe.docframe { display:none !important; }
  .main { display:block !important; }
  .scroll { display:block !important; flex:none !important; overflow:visible !important; height:auto !important; }
  .wrap { max-width:none !important; padding:0 !important; }
  /* 안내문 — 대시보드를 인쇄한 사람이 무엇을 해야 하는지 */
  body::before {
    content:"🐯 zodiac-clue 문서 대시보드\A 이 페이지는 문서를 골라 보는 뷰어입니다. 인쇄해도 내용이 담기지 않습니다.\A PDF로 저장하려면 왼쪽 트리에서 문서를 연 뒤 상단 [원문 ↗]으로 그 문서를 새 탭에 띄우고, 거기서 인쇄하세요.\A (각 문서는 인쇄 전용 라이트 팔레트를 갖고 있습니다.)\A 라이브: https://zodiac-clue.vercel.app  ·  소스: https://github.com/anveloper/zodiac-clue";
    display:block; white-space:pre-wrap; font-size:13px; line-height:1.9; color:#1a1712;
    background:#fdf6e4; border:1px solid #b08b3e; border-left:4px solid #8a6a1e;
    border-radius:10px; padding:18px 22px; margin:0 0 16px;
  }
  /* .md 문서를 연 상태로 인쇄하는 경우 그 본문은 살려서 라이트로 */
  .md h1, .md h2 { color:var(--gold) !important; }
  .md h2 { border-bottom-color:var(--edge) !important; }
  .md h1, .md h2, .md h3 { break-after:avoid; page-break-after:avoid; }
  .md p, .md li, .md td { color:var(--ink) !important; }
  .md strong { color:#5b430f !important; }
  .md code { background:#f1ece0 !important; color:#2c2519 !important; border:1px solid var(--edge) !important; }
  .md pre { background:#f7f4ec !important; border:1px solid var(--edge) !important;
    white-space:pre-wrap !important; word-break:break-word; }
  .md pre code { background:none !important; border:0 !important; color:#1a1712 !important; }
  .md blockquote { background:#fdf6e4 !important; border-left-color:var(--accent) !important; color:var(--dim) !important; }
  .md table { display:table !important; width:100% !important; overflow:visible !important; }
  .md th { background:#efe8d8 !important; color:var(--gold) !important; }
  .md th, .md td { border-color:var(--edge) !important; word-break:break-word; }
  .md hr { border-top-color:var(--edge) !important; }
  .md .chk-done { color:#1d6b3a !important; } .md .chk-part { color:#8a5b0a !important; }
  .md .chk-todo { color:var(--dim) !important; }
  .home-card { background:var(--card) !important; border-color:var(--edge) !important; }
  .home-card h1 { color:var(--gold) !important; } .home-card p { color:var(--dim) !important; }
  .home-card h2 { color:var(--gold) !important; }
  .feat a, .groups a { background:#f4f0e6 !important; border-color:var(--edge) !important; }
  .feat .k, .groups b { color:#5b430f !important; } .feat .d { color:var(--dim) !important; }
  .feat a, .groups a { break-inside:avoid; page-break-inside:avoid; }
  a { color:#0b4a8f !important; text-decoration:underline; }
  a[href^="http"]::after { content:" (" attr(href) ")"; font-size:10px; color:#4f4738; word-break:break-all; }
  .md pre, .md table, .md tr, .md li, .home-card { break-inside:avoid; page-break-inside:avoid; }
  * { scrollbar-width:none !important; }
  ::-webkit-scrollbar { display:none !important; }
}
</style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="brand">🐯 zodiac-clue 문서</div>
      <div class="links">
        <a href="https://zodiac-clue.vercel.app" target="_blank">🎮 라이브</a>
        <a href="https://github.com/anveloper/zodiac-clue" target="_blank">GitHub</a>
      </div>
    </div>
    <nav id="tree"></nav>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <button id="backList">← 목록</button>
      <span class="crumb" id="crumb">문서 대시보드</span>
      <a class="raw" id="rawLink" href="#" target="_blank" style="display:none">원문 ↗</a>
    </div>
    <div class="scroll" id="scroll">
      <div class="wrap" id="content"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = (s) => s
    .replace(/`([^`]+)`/g,(_m,c)=>`<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  const checkbox = (h) => h
    .replace(/^\[( )\]\s*/,'<span class="chk chk-todo">☐</span> ')
    .replace(/^\[([xX])\]\s*/,'<span class="chk chk-done">☑</span> ')
    .replace(/^\[~\]\s*/,'<span class="chk chk-part">◐</span> ')
    .replace(/^\[→\]\s*/,'<span class="chk">→</span> ');

  function mdToHtml(md){
    const blk=[];
    md=md.replace(/```([\s\S]*?)```/g,(_m,c)=>{blk.push(c.replace(/^\n/,"").replace(/\n$/,""));return ` CODE${blk.length-1} `;});
    const L=md.split("\n"); let out="",i=0,lt=null;
    const cl=()=>{if(lt){out+=`</${lt}>`;lt=null;}};
    while(i<L.length){
      const ln=L[i];
      const cm=ln.match(/^ CODE(\d+) $/);
      if(cm){cl();out+=`<pre><code>${esc(blk[+cm[1]])}</code></pre>`;i++;continue;}
      if(/^\s*$/.test(ln)){cl();i++;continue;}
      if(/^---+$/.test(ln.trim())){cl();out+="<hr>";i++;continue;}
      const h=ln.match(/^(#{1,4})\s+(.*)$/);
      if(h){cl();out+=`<h${h[1].length}>${inline(esc(h[2]))}</h${h[1].length}>`;i++;continue;}
      if(/^>\s?/.test(ln)){cl();let b="";while(i<L.length&&/^>\s?/.test(L[i])){b+=inline(esc(L[i].replace(/^>\s?/,"")))+"<br>";i++;}out+=`<blockquote>${b}</blockquote>`;continue;}
      if(ln.includes("|")&&i+1<L.length&&/^[\s|:-]+$/.test(L[i+1])&&L[i+1].includes("-")){
        const row=(r)=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
        const hd=row(ln);i+=2;
        let t=`<table><thead><tr>${hd.map(x=>`<th>${inline(esc(x))}</th>`).join("")}</tr></thead><tbody>`;
        while(i<L.length&&L[i].includes("|")){t+=`<tr>${row(L[i]).map(c=>`<td>${inline(esc(c))}</td>`).join("")}</tr>`;i++;}
        out+=t+"</tbody></table>";continue;
      }
      const li=ln.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
      if(li){const want=/\d+\./.test(li[2])?"ol":"ul";if(lt!==want){cl();lt=want;out+=`<${want}>`;}out+=`<li>${checkbox(inline(esc(li[3])))}</li>`;i++;continue;}
      cl();out+=`<p>${inline(esc(ln))}</p>`;i++;
    }
    cl();return out;
  }

  let manifest=[];
  const flat=()=>manifest.flatMap(g=>g.items);

  function buildTree(){
    const tree=$("tree"); tree.innerHTML="";
    for(const g of manifest){
      const d=document.createElement("details"); d.open=true;
      const s=document.createElement("summary"); s.textContent=g.label; d.appendChild(s);
      for(const it of g.items){
        const a=document.createElement("a"); a.textContent=it.title;
        if(it.external || it.url){
          // 파일이 아닌 외부 링크(빌드·영상) — 새 탭으로 열고 라우팅하지 않는다.
          a.className="doc ext"; a.href=it.url; a.target="_blank"; a.rel="noopener";
          a.title=it.url;
        } else {
          a.className=it.private?"doc priv":"doc"; a.href="#"+it.path;
          a.dataset.path=it.path;
          if(it.private) a.title="내부 전용 — 배포본에 포함되지 않는다";
        }
        d.appendChild(a);
      }
      tree.appendChild(d);
    }
  }

  function setActive(path){
    document.querySelectorAll("nav#tree a.doc").forEach(a=>a.classList.toggle("active",a.dataset.path===path));
  }

  // 추천 진입점. **경로는 manifest에 있을 때만 카드가 렌더된다** —
  // manifest는 scripts/docs-private.mjs의 비공개 규칙으로 이미 걸러져 있으므로,
  // 여기에 내부 문서 경로를 적어도 공개 사이트에서는 카드 자체가 사라진다(죽은 링크 0).
  // 즉 이 목록은 "링크 후보"이지 "공개 선언"이 아니다.
  const FEATURED=[
    {path:"submission/03-game-intro.html",           k:"게임 소개",        d:"목표 · 조작 · 종료 조건 · 실행 방법. 처음이라면 여기부터."},
    {path:"submission/04-ai-tech.html",              k:"AI 활용 기술 문서", d:"결정론 진실 계층 / LLM 표현 계층 분리 · 환각 검증 · 관측 가능성."},
    {path:"design/20260727-ui-copy.html",            k:"UI 문안 명세",      d:"화면에 나오는 한국어 문장 전부의 단일 출처. 조사 회피 6규칙."},
    {path:"design/20260727-view-contract-spec.html", k:"뷰 계약",           d:"렌더러 4종이 공유하는 ViewContract — 표현 계층은 뷰를 모른다."},
    {path:"design/20260720-engine-and-workflow-plan.html", k:"엔진 · 워크플로", d:"재사용 엔진과 교체 가능한 게임 콘텐츠를 나눈 배경."},
  ];

  function showHome(){
    setActive(null); $("crumb").textContent="문서 대시보드"; $("rawLink").style.display="none";
    const paths=new Set(flat().filter(x=>x.path).map(x=>x.path));
    const priv=flat().filter(x=>x.private);
    const total=flat().filter(x=>!x.private).length; // 외부 링크(path 없음)도 제출물로 셈
    const feat=FEATURED.filter(f=>paths.has(f.path))
      .map(f=>`<a href="#${f.path}"><span class="k">${f.k}</span><span class="d">${f.d}</span></a>`).join("");
    const groups=manifest.map(g=>`<a href="#" data-g="${g.dir}">${g.label} <b>${g.items.length}</b></a>`).join("");
    // 내부 문서 카드 — **로컬에서만 데이터가 존재**하므로 배포본에서는 이 블록이 통째로 비어 있다.
    const privbox=priv.length?`<div class="privbox">
      <h2>🔒 내부 전용 — 로컬에서만 보임 <b>${priv.length}</b></h2>
      <p class="why">진행 중 작업 목록 · 보류 · 상류 리서치 · 자기 결함 목록. <b>공개 사이트에는 이 문서들이 복사되지 않는다</b>
        (<code>scripts/docs-private.mjs</code>). 지금 보이는 이유는 <b>로컬에서 열었기 때문</b>이며, 목록 자체가
        <code>manifest.local.json</code>에만 있고 그 파일은 배포 산출물에서 제외된다.</p>
      <div class="feat">${priv.map(f=>`<a href="#${f.path}"><span class="k">🔒 ${esc(f.title)}</span><span class="d">${esc(f.path)}</span></a>`).join("")}</div>
    </div>`:"";
    $("content").innerHTML=`<div class="home-card">
      <h1>🐯 zodiac-clue 문서</h1>
      <p>호랑이 생신 잔치 · 십이지 손님 중 도둑을 찾는 웹 멀티 추리 게임. 빈자리는 AI NPC가 채웁니다.</p>
      <p class="live">🎮 라이브: <a href="https://zodiac-clue.vercel.app" target="_blank">zodiac-clue.vercel.app</a>
        &nbsp;·&nbsp; <a href="https://github.com/anveloper/zodiac-clue" target="_blank">GitHub</a></p>

      <h2>먼저 볼 것</h2>
      <div class="feat">${feat}</div>

      <h2>전체 ${total}개${priv.length?` <span style="color:#c9a06a">+ 내부 ${priv.length}</span>`:""}</h2>
      <div class="groups">${groups}</div>
      ${privbox}

      <div class="home-note">
        <p><b>문서 규칙</b> — <code>plans/</code>는 AI용 압축 <code>.md</code>, 그 밖의 문서는 사람용 <code>.md</code> + 수기 디자인 <code>.html</code> 2중이다.
        기계 변환(md→html)은 쓰지 않는다. 이 뷰어는 <code>.md</code>를 같은 톤으로 렌더하고 <code>.html</code>은 원본 그대로 띄운다.</p>
        <p>설계 문서와 개발일지·완료 플랜을 함께 남긴 이유는 결과물뿐 아니라 <b>AI 에이전트 워크플로로 개발한 과정</b>이 이 프로젝트의 산출물이기 때문이다.
        진행 중 작업 목록과 상류 리서치 등 일부 내부 문서는 배포본에서 제외된다.</p>
      </div>
    </div>`;
    // 그룹 칩 → 좌측 트리의 해당 그룹으로 스크롤 + 펼치기
    $("content").querySelectorAll(".groups a").forEach(a=>{
      a.onclick=(e)=>{
        e.preventDefault();
        const i=manifest.findIndex(g=>g.dir===a.dataset.g);
        const d=document.querySelectorAll("nav#tree details")[i];
        if(!d) return;
        d.open=true;
        if(window.innerWidth<=760) openSidebar();
        d.scrollIntoView({block:"nearest"});
      };
    });
    $("scroll").scrollTop=0;
  }

  async function openDoc(path){
    const item=flat().find(x=>x.path===path);
    if(!item){ showHome(); return; }
    setActive(path);
    // 내부 문서를 열면 상단에도 «내부»를 남긴다 — 트리를 접고 보는 사람이 오해하지 않도록.
    $("crumb").innerHTML=(item.private?'<span class="priv-badge">🔒 내부 · 배포 제외</span>':"")+esc(item.title);
    $("rawLink").href="./"+path; $("rawLink").style.display="";
    const content=$("content");
    if(path.endsWith(".html")){
      // 이미 디자인된 페이지 → iframe으로 프레임 유지하며 표시
      content.innerHTML=`<iframe class="docframe" src="./${path}"></iframe>`;
      // iframe이 스크롤 영역을 꽉 채우도록 wrap 패딩 제거
      content.style.maxWidth="none"; content.style.padding="0";
      $("scroll").style.overflow="hidden";
      content.querySelector("iframe").style.height=$("scroll").clientHeight+"px";
    } else {
      content.style.maxWidth=""; content.style.padding=""; $("scroll").style.overflow="auto";
      content.className="wrap md"; content.innerHTML="불러오는 중…";
      try{
        const r=await fetch("./"+path,{cache:"no-cache"}); if(!r.ok)throw new Error("HTTP "+r.status);
        content.innerHTML=mdToHtml(await r.text());
      }catch(e){ content.innerHTML=`<p style="color:#e0736b">문서를 불러오지 못했습니다: ${e.message}</p>`; }
      $("scroll").scrollTop=0;
    }
    // 모바일: 선택 시 사이드바 닫기
    closeSidebar();
  }

  function route(){
    const path=decodeURIComponent(location.hash.replace(/^#/,""));
    if(path) openDoc(path); else showHome();
  }

  // 모바일 사이드바
  const openSidebar=()=>{ $("sidebar").classList.add("open"); $("backdrop").classList.add("show"); };
  const closeSidebar=()=>{ $("sidebar").classList.remove("open"); $("backdrop").classList.remove("show"); };
  $("hamburger").onclick=openSidebar;
  $("backdrop").onclick=closeSidebar;
  $("backList").onclick=()=>{ if(window.innerWidth<=760){ openSidebar(); } location.hash=""; showHome(); };

  /* ── 로컬 / 배포 판정 ──────────────────────────────────────────────
     내부 문서는 **로컬에서만** 보여야 하고, 공개 사이트에서는 지금과 똑같이 안 보여야 한다.
     방어선을 두 겹으로 둔다.

     ① **데이터** (이게 진짜 방어선) — 내부 문서 목록은 `manifest.local.json`에만 있고,
        `scripts/docs-private.mjs`의 `LOCAL_MANIFEST`가 그 파일을 비공개로 판정하므로
        `copy-public-docs.mjs`가 **배포 산출물(apps/client/dist/docs)에 복사하지 않는다.**
        내부 문서 본문 파일도 마찬가지로 복사되지 않는다. 즉 배포본에는 **보여줄 데이터도,
        열어볼 문서도 없다** — 이 스크립트가 어떻게 동작하든 카드는 생기지 않는다.
     ② **요청** — 그럼에도 배포본에서 404 요청이 나가지 않도록, 호스트가 로컬일 때만 읽는다.
        아래 판정은 **로컬 화이트리스트**다. 배포 도메인(zodiac-clue.vercel.app · *.vercel.app ·
        프리뷰 URL)은 어느 항목에도 해당하지 않으므로 **반드시 «배포»로 떨어진다.**
        LAN IP(192.168.x.x 등)로 띄운 경우도 «배포»로 떨어진다 — 남에게 보여주는 상황이라
        가리는 쪽이 안전하다(fail-closed). */
  const LOCAL_HOSTS=["localhost","127.0.0.1","0.0.0.0","::1","[::1]",""];
  const IS_LOCAL = location.protocol==="file:" ||
    LOCAL_HOSTS.includes(location.hostname) ||
    /\.localhost$|\.local$/i.test(location.hostname);

  const loadJson=async(f)=>{
    try{ const r=await fetch(f,{cache:"no-cache"}); return r.ok?await r.json():null; }
    catch{ return null; }
  };

  (async()=>{
    manifest=await loadJson("./manifest.json") ?? [];
    if(IS_LOCAL){
      // 전체 목록(내부 포함). 없으면(= 배포본, 또는 마니페스트 미생성) 공개본 그대로 간다.
      const local=await loadJson("./manifest.local.json");
      if(Array.isArray(local)&&local.length) manifest=local;
    }
    buildTree(); route();
    window.addEventListener("hashchange",route);
  })();
</script>
</body>
</html>
