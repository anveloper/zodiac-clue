<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="호랑이">
  <!-- 얼굴(주황 라운드 사각) -->
  <rect width="64" height="64" rx="15" fill="#E58A3E"/>
  <!-- 귀 -->
  <path d="M11 13 L23 17 L16 25 Z" fill="#33271A"/>
  <path d="M53 13 L41 17 L48 25 Z" fill="#33271A"/>
